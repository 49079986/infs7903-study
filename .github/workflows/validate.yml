name: Validate static website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check publication files and links
        run: python3 scripts/validate_site.py
      - name: Check page-motion navigation boundaries
        run: node scripts/check_page_motion.cjs
